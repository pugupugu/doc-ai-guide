name: Deploy to GitHub Pages

# index.html 한 파일만 올린다 (빌드 단계 없음).
# 질문 목록을 고쳤다면 먼저 로컬에서 `node --experimental-strip-types scripts/build-index.mjs`로 index.html을 다시 만들어 올린다.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - run: mkdir site && cp index.html site/index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
